# Rainy NYC Night — a Ghostty color scheme
#
# Imagined from the curb of a Manhattan avenue at 1am: a wet, slate-black
# street under a bruised indigo sky, slick with last night's rain. The city
# never sleeps, so the dark isn't empty — it's alive with reflected neon.
# Magenta hotel signs bleed into puddles, cyan taxi light smears across the
# asphalt, sodium streetlamps pool warm amber, and red taillights trail off
# down the block. Cool, pale light bounces off everything wet.
#
# The background is the wet asphalt + night sky. Foreground is the pale,
# reflected glow. The accents are the neon and lamp-light you'd actually see.

# Base canvas
background              = #0a0e16
foreground              = #d4dcea
cursor-color            = #ff7eb6
selection-background    = #2c3a52
selection-foreground    = #eef3fb

# 16-color palette (0-15)
# 0  black             deep wet asphalt / night sky
# 1  red               trailing red taillights
# 2  green             wet-green traffic glow / reflection
# 3  yellow            sodium streetlamp amber
# 4  blue              electric building lights
# 5  magenta           hot neon bar / hotel sign
# 6  cyan              taxi & rain-slicked cyan smear
# 7  white             pale concrete in the lamp glow
# 8  bright black      muted slate (dim text)
# 9  bright red        brighter brake light
# 10 bright green      neon mint sign
# 11 bright yellow     warm bulb highlight
# 12 bright blue       skyline window blue
# 13 bright magenta    pink neon bloom
# 14 bright cyan       clear rain-reflection cyan
# 15 bright white      cool daylight-white glare
palette = 0  = #0a0e16
palette = 1  = #ff5b6e
palette = 2  = #4fd99a
palette = 3  = #f2b35e
palette = 4  = #5a8dff
palette = 5  = #ff6ac1
palette = 6  = #4fd6e0
palette = 7  = #9fadc0
palette = 8  = #2c3a52
palette = 9  = #ff8492
palette = 10 = #7eecc0
palette = 11 = #ffd27a
palette = 12 = #84aaff
palette = 13 = #ff9bdc
palette = 14 = #84e9f2
palette = 15 = #eef3fb
